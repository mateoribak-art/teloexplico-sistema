# El técnico de la oficina (herramientas/arreglar.py): lo lanza la vigilancia (arreglar.py revisar) o un botón de oficina/index.html.
# arreglar: Claude busca la causa del problema de un empleado y lo resuelve solo; frena solo si necesita a Mateo.
# deshacer: revierte un arreglo aplicado. visto: Mateo ya hizo lo que se le pedía.
name: Arreglar
run-name: "${{ inputs.accion }} ${{ inputs.id }} (${{ inputs.empleado }})"

on:
  workflow_dispatch:
    inputs:
      accion:
        description: 'arreglar · deshacer · visto'
        type: choice
        options: [arreglar, deshacer, visto]
        default: arreglar
      id:
        description: 'id del arreglo (lo arma la oficina)'
        required: true
      empleado:
        description: 'cuenta/empleado, ej. es/jefe'
        default: ''
      problema:
        description: 'el problema, con su registro (solo para arreglar)'
        default: ''
      auto:
        description: 'si = lo lanzó la vigilancia'
        default: 'no'

# arreglar usa la cuota de Claude: espera su turno junto con la producción; deshacer y visto van aparte
concurrency:
  group: ${{ inputs.accion == 'arreglar' && 'claude' || 'arreglos' }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # el técnico puede relanzar un flujo (gh workflow run)

jobs:
  arreglar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TLX_NUBE: '1'
      TZ: America/Argentina/Buenos_Aires
      GH_TOKEN: ${{ github.token }}
      CLAVE_ESTADO: ${{ secrets.CLAVE_ESTADO }}
      ARREGLO_ACCION: ${{ inputs.accion }}
      ARREGLO_ID: ${{ inputs.id }}
      ARREGLO_EMPLEADO: ${{ inputs.empleado }}
      ARREGLO_PROBLEMA: ${{ inputs.problema }}
      ARREGLO_AUTO: ${{ inputs.auto }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Claves
        run: bash herramientas/nube/preparar.sh
        env:
          META_JSON: ${{ secrets.META_JSON }}
          META_EN_JSON: ${{ secrets.META_EN_JSON }}
          AVISOS_JSON: ${{ secrets.AVISOS_JSON }}
          TIKTOK_JSON: ${{ secrets.TIKTOK_JSON }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
      - name: Claude
        if: inputs.accion == 'arreglar'
        run: |
          npm install -g @anthropic-ai/claude-code > /dev/null
          git config user.name teloexplico-nube
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          # sin "confianza" en la carpeta, Claude ignora los permisos de .claude/settings.json
          python - <<'EOF'
          import json, os
          p = os.path.expanduser('~/.claude.json')
          d = json.load(open(p)) if os.path.exists(p) else {}
          d.setdefault('projects', {}).setdefault(os.environ['GITHUB_WORKSPACE'], {})['hasTrustDialogAccepted'] = True
          d['hasCompletedOnboarding'] = True
          json.dump(d, open(p, 'w'))
          EOF
      - name: Técnico
        working-directory: herramientas
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          git config user.name teloexplico-nube
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python -I arreglar.py "$ARREGLO_ACCION"
      - name: Guardar estado
        if: always()
        working-directory: herramientas
        run: |
          python -I sincronizar.py "Oficina: arreglo ${ARREGLO_ID} (${ARREGLO_ACCION})"

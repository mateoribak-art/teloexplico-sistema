# Tareas livianas en la nube: resumen diario (21:00) y vigilancia (cada 2 h de 8 a 24, hora de Argentina).
# Desde el 27/10 también para @letmeexplain.us (TLX_CUENTA=en, avisos con [EN]), si ya están sus claves.
name: Resumen y vigilancia

on:
  schedule:
    # resumen (actualiza métricas): 21:05, 21:35 y 22:05 Argentina; GitHub saltea a veces lo programado, sale una vez por día
    - cron: '5 0 * * *'
    - cron: '35 0 * * *'
    - cron: '5 1 * * *'
    - cron: '20 1,3,11,13,15,17,19,21,23 * * *'      # 8:20 a 0:20 Argentina, cada 2 h: vigilancia
  workflow_dispatch:
    inputs:
      modo:
        description: 'resumen o vigilar'
        type: choice
        options: [vigilar, resumen]
        default: vigilar

concurrency:
  group: estado
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # para lanzar el publicador si quedó un turno sin cubrir

jobs:
  tarea:
    # interruptor: lo programado corre solo con la variable NUBE_ACTIVA=si (a mano corre siempre)
    if: github.event_name == 'workflow_dispatch' || vars.NUBE_ACTIVA == 'si'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TLX_NUBE: '1'
      TZ: America/Argentina/Buenos_Aires
      GH_TOKEN: ${{ github.token }}
      CLAVE_ESTADO: ${{ secrets.CLAVE_ESTADO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Claves
        run: bash herramientas/nube/preparar.sh
        env:
          META_JSON: ${{ secrets.META_JSON }}
          META_EN_JSON: ${{ secrets.META_EN_JSON }}
          AVISOS_JSON: ${{ secrets.AVISOS_JSON }}
          TIKTOK_JSON: ${{ secrets.TIKTOK_JSON }}
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
      - name: Correr
        working-directory: herramientas
        run: |
          case "${{ github.event.schedule }}" in
            '5 0 * * *'|'35 0 * * *'|'5 1 * * *') MODO=resumen ;;
            '') MODO="${{ inputs.modo }}" ;;
            *) MODO=vigilar ;;
          esac
          HOY=$(date +%F)
          # cada cuenta con su marca de "el resumen de hoy ya salió" (videos/ y videos/en/)
          correr() {
            local CARPETA="$1"
            if [ "$MODO" = "resumen" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ] && [ "$(cat "$CARPETA/ultimo_resumen.txt" 2>/dev/null)" = "$HOY" ]; then
              echo "el resumen de hoy ya salió ($CARPETA)"; return 0
            fi
            python -I estado.py "$MODO"
            if [ "$MODO" = "resumen" ]; then echo "$HOY" > "$CARPETA/ultimo_resumen.txt"; fi
          }
          correr ../videos
          if [ -s ../secretos/meta_en.json ]; then TLX_CUENTA=en correr ../videos/en; fi
      - name: ¿Quedó un turno sin publicar?
        # red extra: si GitHub salteó los intentos del publicador, la vigilancia lo lanza a mano (eso no se demora)
        working-directory: herramientas
        run: |
          revisar() {   # $1: cuenta (es | en)
            if [ "$(TLX_CUENTA=$1 python -I publicador.py --toca)" = "si" ]; then
              MIN=$(TLX_CUENTA=$1 python -c "import datetime as d, publicador as p; print(int((d.datetime.now(p.ZONA) - p.turno_actual()).total_seconds() // 60))")
              echo "turno de $1 sin cubrir hace $MIN min"
              if [ "$MIN" -ge 20 ]; then gh workflow run publicar.yml -f modo=publicar -f cuenta=$1 && echo "publicador lanzado ($1)"; fi
            fi
          }
          revisar es
          if [ -s ../secretos/meta_en.json ]; then revisar en; fi
      - name: Técnico automático
        # cada problema nuevo de la oficina que no se arregla solo despierta al técnico (arreglar.py; frena solo si necesita a Mateo)
        if: always()
        working-directory: herramientas
        run: |
          python -I reparar.py
          python -I oficina.py
          python -I arreglar.py revisar
      - name: Guardar estado
        if: always()
        working-directory: herramientas
        run: |
          python -I sincronizar.py "Nube: resumen/vigilancia"
